# MediaMTX configuration for CloudNexus
# Docs: https://github.com/bluenviron/mediamtx

# API settings (enabled for dynamic path management)
api: yes
apiAddress: :8889

# RTSP server
rtspAddress: :8554

# RTMP server
rtmpAddress: :1935

# WebRTC
webrtcAddress: :8890

# HLS settings
hlsAddress: :8888
hlsAlwaysRemux: yes

# Path defaults (paths are created dynamically by camera-svc)
paths:
  all:
    source: publisher

# SECURITY: 配置认证用户
authInternalUsers:
  - user: cloudnexus
    pass: cloudnexus123
    permissions:
      - action: api
      - action: publish
      - action: read
      - action: playback
