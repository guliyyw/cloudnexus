events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;

    # Runtime discovery defaults. Docker DNS returns the current container IP
    # and lets nginx start before optional services exist. Later cross-server
    # discovery can override these variables from files in nginx/discovery/.

    # TLS configuration (uncomment and provide certificate paths):
    #   server {
    #       listen 443 ssl http2;
    #       server_name your-domain.com;
    #       ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #       ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #       ssl_protocols TLSv1.2 TLSv1.3;
    #       ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
    #       ssl_prefer_server_ciphers on;
    #       ssl_session_cache shared:SSL:10m;
    #       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #       # ... location blocks same as below ...
    #   }

    server {
        listen 80;
        client_max_body_size 100m;
        proxy_intercept_errors on;

        set $user_file_backend "http://user-file-svc:8081";
        set $im_backend "http://im-svc:8082";
        set $docker_backend "http://docker-svc:8083";
        set $camera_backend "http://camera-svc:8085";
        set $mediamtx_hls "http://mediamtx:8888";
        set $collab_backend "http://collab-svc:8086";
        set $drama_backend "http://drama-svc:8087";

        include /etc/nginx/discovery/*.conf;

        error_page 502 503 504 = @service_unavailable;

        location @service_unavailable {
            default_type application/json;
            add_header Retry-After 5 always;
            return 503 '{"code":503,"message":"service unavailable or starting","data":null}';
        }

        # Fix double-slash URIs (e.g., //api/... from Apifox misconfigured URL prefix)
        # $request_uri preserves the original request; 308 keeps the HTTP method intact
        if ($request_uri ~ "^//(.*)$") {
            return 308 /$1$is_args$args;
        }

        # API: IM service
        location /api/v1/im {
            proxy_pass $im_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API: Docker service
        location /api/v1/docker {
            proxy_pass $docker_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API: Camera service
        location /api/v1/cameras {
            proxy_pass $camera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/detect-image {
            proxy_pass $camera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API: Video analysis
        location /api/v1/detect-video {
            proxy_pass $camera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 500m;
        }

        # API: Face library
        location /api/v1/faces {
            proxy_pass $camera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API: Collab documents (handled by user-file-svc)
        location /api/v1/collab {
            proxy_pass $user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API: Drama workshop
        location /api/v1/drama {
            proxy_pass $drama_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            client_max_body_size 500m;
        }

        location /api/v1/image-generation {
            proxy_pass $drama_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 45m;
        }

        # Rate-limited auth endpoints
        location /api/v1/user/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass $user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/user/register {
            limit_req zone=register burst=2 nodelay;
            proxy_pass $user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/v1/user/password/forgot {
            limit_req zone=register burst=2 nodelay;
            proxy_pass $user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API: General (catch-all, must be AFTER more specific routes)
        location /api {
            limit_req zone=api burst=50 nodelay;
            proxy_pass $user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # HLS streaming from MediaMTX. The CDN secret authenticates this
        # trusted proxy without exposing MediaMTX credentials to browsers.
        location ~ ^/(cam_[^/]+/.*)$ {
            set $mtx_uri $1;
            proxy_pass $mediamtx_hls/$mtx_uri$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host mediamtx:8888;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "Bearer cloudnexus-hls-proxy-2026";
            proxy_read_timeout 30s;
            proxy_connect_timeout 3s;
            proxy_next_upstream off;
        }

        # WebSocket for drama task progress
        location /ws/drama {
            proxy_pass $drama_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # WebSocket for IM (sticky via ip_hash on im_backend)
        location /ws {
            proxy_pass $im_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket for Collab (Yjs)
        location /ws/collab {
            proxy_pass $collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check — per service
        location /healthz/user-file-svc {
            proxy_pass $user_file_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /healthz/im-svc {
            proxy_pass $im_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /healthz/docker-svc {
            proxy_pass $docker_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /healthz/camera-svc {
            proxy_pass $camera_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /healthz/collab-svc {
            proxy_pass $collab_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /healthz/drama-svc {
            proxy_pass $drama_backend/healthz;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # Aggregated health check
        location /healthz {
            proxy_pass $user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Metrics
        location /metrics {
            proxy_pass $user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend entry/version files must never be reused across deployments.
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        location = /version.json {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            expires -1;
        }

        # Vite fingerprints built assets, so immutable caching is safe here.
        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Frontend: built static files with SPA fallback
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
