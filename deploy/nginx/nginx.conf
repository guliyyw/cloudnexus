events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # All services run in Docker. Proxy to service names via internal DNS.
    # Only port 80 is exposed to host.

    server {
        listen 80;
        client_max_body_size 100m;

        # API: IM service
        location /api/v1/im {
            proxy_pass http://im-svc:8082;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: Docker service
        location /api/v1/docker {
            proxy_pass http://docker-svc:8083;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: User/File service (catch-all, must be AFTER more specific routes)
        location /api {
            proxy_pass http://user-file-svc:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket for IM
        location /ws {
            proxy_pass http://im-svc:8082;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /healthz {
            proxy_pass http://user-file-svc:8081;
        }

        # Metrics
        location /metrics {
            proxy_pass http://user-file-svc:8081;
        }

        # Frontend: built static files with SPA fallback
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
