events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Upstream definitions for multi-server load balancing.
    # In single-server deployment, each upstream has a single server.
    # In multi-server deployment, add additional server lines.
    # Docker internal DNS resolves service names; external hosts use IP:port.

    upstream user_file_backend {
        # Default: single server. For multi-server, add more entries:
        #   server host2:8081 max_fails=3 fail_timeout=30s;
        server user-file-svc:8081 max_fails=3 fail_timeout=30s;
    }

    upstream im_backend {
        ip_hash;  # sticky session for WebSocket
        server im-svc:8082 max_fails=3 fail_timeout=30s;
    }

    upstream docker_backend {
        server docker-svc:8083 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;
        client_max_body_size 100m;

        # Fix double-slash URIs (e.g., //api/... from Apifox misconfigured URL prefix)
        # $request_uri preserves the original request; 308 keeps the HTTP method intact
        if ($request_uri ~ "^//(.*)$") {
            return 308 /$1$is_args$args;
        }

        # API: IM service
        location /api/v1/im {
            proxy_pass http://im_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: Docker service
        location /api/v1/docker {
            proxy_pass http://docker_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: User/File service (catch-all, must be AFTER more specific routes)
        location /api {
            proxy_pass http://user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket for IM (sticky via ip_hash on im_backend)
        location /ws {
            proxy_pass http://im_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check — per service
        location /healthz/user-file-svc {
            proxy_pass http://user_file_backend/healthz;
        }
        location /healthz/im-svc {
            proxy_pass http://im_backend/healthz;
        }
        location /healthz/docker-svc {
            proxy_pass http://docker_backend/healthz;
        }
        # Aggregated health check
        location /healthz {
            proxy_pass http://user_file_backend;
        }

        # Metrics
        location /metrics {
            proxy_pass http://user_file_backend;
        }

        # Frontend: built static files with SPA fallback
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
