events {
    worker_connections 1024;
}

http {
    upstream userfile {
        server user-file-svc:8081;
    }

    upstream im {
        server im-svc:8082;
    }

    upstream docker {
        server docker-svc:8083;
    }

    server {
        listen 80;

        location /api/v1/file {
            proxy_pass http://userfile;
        }
        location /api/v1/user {
            proxy_pass http://userfile;
        }

        location /api/v1/im {
            proxy_pass http://im;
        }

        location /ws {
            proxy_pass http://im;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }

        location /api/v1/docker {
            proxy_pass http://docker;
        }

        location /healthz {
            proxy_pass http://userfile;
        }
    }
}
