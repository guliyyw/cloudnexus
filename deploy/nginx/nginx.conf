events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=register:10m rate=3r/m;

    # Upstream definitions for multi-server load balancing.
    # In single-server deployment, each upstream has a single server.
    # In multi-server deployment, add additional server lines.
    # Docker internal DNS resolves service names; external hosts use IP:port.

    upstream user_file_backend {
        # Default: single server. For multi-server, add more entries:
        #   server host2:8081 max_fails=3 fail_timeout=30s;
        server user-file-svc:8081 max_fails=3 fail_timeout=30s;
    }

    upstream im_backend {
        ip_hash;  # sticky session for WebSocket
        server im-svc:8082 max_fails=3 fail_timeout=30s;
    }

    upstream docker_backend {
        server docker-svc:8083 max_fails=3 fail_timeout=30s;
    }

    upstream camera_backend {
        server camera-svc:8085 max_fails=3 fail_timeout=30s;
    }

    upstream mediamtx_hls {
        server mediamtx:8888 max_fails=3 fail_timeout=30s;
    }

    upstream collab_backend {
        server collab-svc:8086 max_fails=3 fail_timeout=30s;
    }

    # TLS configuration (uncomment and provide certificate paths):
    #   server {
    #       listen 443 ssl http2;
    #       server_name your-domain.com;
    #       ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #       ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #       ssl_protocols TLSv1.2 TLSv1.3;
    #       ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
    #       ssl_prefer_server_ciphers on;
    #       ssl_session_cache shared:SSL:10m;
    #       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #       # ... location blocks same as below ...
    #   }

    server {
        listen 80;
        client_max_body_size 100m;

        # Fix double-slash URIs (e.g., //api/... from Apifox misconfigured URL prefix)
        # $request_uri preserves the original request; 308 keeps the HTTP method intact
        if ($request_uri ~ "^//(.*)$") {
            return 308 /$1$is_args$args;
        }

        # API: IM service
        location /api/v1/im {
            proxy_pass http://im_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: Docker service
        location /api/v1/docker {
            proxy_pass http://docker_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: Camera service
        location /api/v1/cameras {
            proxy_pass http://camera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/detect-image {
            proxy_pass http://camera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: Video analysis
        location /api/v1/detect-video {
            proxy_pass http://camera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            client_max_body_size 500m;
        }

        # API: Face library
        location /api/v1/faces {
            proxy_pass http://camera_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: Collab documents (handled by user-file-svc)
        location /api/v1/collab {
            proxy_pass http://user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Rate-limited auth endpoints
        location /api/v1/user/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/user/register {
            limit_req zone=register burst=2 nodelay;
            proxy_pass http://user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/v1/user/password/forgot {
            limit_req zone=register burst=2 nodelay;
            proxy_pass http://user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API: General (catch-all, must be AFTER more specific routes)
        location /api {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://user_file_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # HLS streaming from MediaMTX.
        # MediaMTX uses a cookie-based CSRF check: it redirects the first
        # request with ?cookieCheck=1 and expects the cookie back. When
        # proxied through nginx over HTTP, the browser can't use the
        # Secure-flagged cookie, causing an infinite 302 loop.
        # Fix: always append ?cookieCheck=1 to the proxy URI and send the
        # expected cookie header directly, bypassing the check entirely.
        location ~ ^/(cam_[^/]+/.*)$ {
            set $mtx_uri $1?cookieCheck=1;
            proxy_pass http://mediamtx_hls/$mtx_uri;
            proxy_http_version 1.1;
            proxy_set_header Host mediamtx:8888;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Cookie "cookieCheck=1";
            proxy_hide_header Set-Cookie;
            proxy_read_timeout 10s;
            proxy_connect_timeout 3s;
            proxy_next_upstream off;
        }

        # WebSocket for IM (sticky via ip_hash on im_backend)
        location /ws {
            proxy_pass http://im_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket for Collab (Yjs)
        location /ws/collab {
            proxy_pass http://collab_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check — per service
        location /healthz/user-file-svc {
            proxy_pass http://user_file_backend/healthz;
        }
        location /healthz/im-svc {
            proxy_pass http://im_backend/healthz;
        }
        location /healthz/docker-svc {
            proxy_pass http://docker_backend/healthz;
        }
        location /healthz/camera-svc {
            proxy_pass http://camera_backend/healthz;
        }
        location /healthz/collab-svc {
            proxy_pass http://collab_backend/healthz;
        }
        # Aggregated health check
        location /healthz {
            proxy_pass http://user_file_backend;
        }

        # Metrics
        location /metrics {
            proxy_pass http://user_file_backend;
        }

        # Frontend: built static files with SPA fallback
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
