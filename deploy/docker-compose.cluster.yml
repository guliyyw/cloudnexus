# 集群模式 — 每台服务器独立部署此文件
# 基础设施 (PostgreSQL/Redis/MinIO) 需独立部署，通过 config.cluster.yaml 连接
#
# 多台服务器部署：
#   1. 每台服务器运行此 compose 文件
#   2. 修改 nginx/nginx.conf 中 upstream 块，添加其他服务器地址
#   3. 各服务自动向共享数据库注册节点
#
# 部署命令：
#   docker compose -f docker-compose.cluster.yml up -d

services:
  nginx:
    image: nginx:alpine
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../client/dist:/usr/share/nginx/html:ro
    depends_on:
      - user-file-svc
      - im-svc
      - docker-svc
    restart: unless-stopped

  user-file-svc:
    build:
      context: ../server
      args:
        SERVICE: user-file-svc
    environment:
      - CONFIG_PATH=/app/config/config.cluster.yaml
      - SERVICE_VERSION=latest
      - NODE_HOST=${SERVER_HOST}
      - SNOWFLAKE_NODE_ID=${USER_FILE_NODE_ID:-1}
    volumes:
      - ../server/config/config.cluster.yaml:/app/config/config.cluster.yaml:ro
      - logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  im-svc:
    build:
      context: ../server
      args:
        SERVICE: im-svc
    environment:
      - CONFIG_PATH=/app/config/config.cluster.yaml
      - SERVICE_VERSION=latest
      - NODE_HOST=${SERVER_HOST}
      - SNOWFLAKE_NODE_ID=${IM_NODE_ID:-2}
    volumes:
      - ../server/config/config.cluster.yaml:/app/config/config.cluster.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  docker-svc:
    build:
      context: ../server
      args:
        SERVICE: docker-svc
    environment:
      - CONFIG_PATH=/app/config/config.cluster.yaml
      - SERVICE_VERSION=latest
      - NODE_HOST=${SERVER_HOST}
      - SNOWFLAKE_NODE_ID=${DOCKER_NODE_ID:-3}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../server/config/config.cluster.yaml:/app/config/config.cluster.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  logs:
