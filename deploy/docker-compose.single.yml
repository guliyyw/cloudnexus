services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cloudnexus
      POSTGRES_PASSWORD: cloudnexus
      POSTGRES_DB: cloudnexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnexus"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-file-svc:
    build:
      context: ../server
      args:
        SERVICE: user-file-svc
    environment:
      - CONFIG_PATH=/app/config/config.docker.yaml
      - SERVICE_VERSION=latest
      - SNOWFLAKE_NODE_ID=1
      # 默认管理员 — 仅当数据库中无用户时创建（首次启动）
      - DEFAULT_ADMIN_USERNAME=admin
      - DEFAULT_ADMIN_PASSWORD=CloudNexus@admin
      - DEFAULT_ADMIN_EMAIL=admin@cloudnexus.local
    ports:
      - "8081:8081"
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  im-svc:
    build:
      context: ../server
      args:
        SERVICE: im-svc
    environment:
      - CONFIG_PATH=/app/config/config.docker.yaml
      - SERVICE_VERSION=latest
      - SNOWFLAKE_NODE_ID=2
    ports:
      - "8082:8082"
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  docker-svc:
    build:
      context: ../server
      args:
        SERVICE: docker-svc
    environment:
      - CONFIG_PATH=/app/config/config.docker.yaml
      - SERVICE_VERSION=latest
      - SNOWFLAKE_NODE_ID=3
    ports:
      - "8083:8083"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  mediamtx:
    image: bluenviron/mediamtx:latest
    ports:
      - "8888:8888"
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped

  ai-inference:
    build:
      context: .
      dockerfile: ./ai-inference/Dockerfile
    restart: unless-stopped
    # GPU support: uncomment the following lines if NVIDIA GPU is available
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  camera-svc:
    build:
      context: ../server
      args:
        SERVICE: camera-svc
    environment:
      - CONFIG_PATH=/app/config/config.docker.yaml
      - SERVICE_VERSION=latest
      - SNOWFLAKE_NODE_ID=5
      - MEDIAMTX_API_URL=http://mediamtx:8889
      - AI_INFERENCE_URL=http://ai-inference:8000
    ports:
      - "8085:8085"
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../client/dist:/usr/share/nginx/html:ro
    depends_on:
      user-file-svc:
        condition: service_healthy
      im-svc:
        condition: service_healthy
      docker-svc:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
  logs:
