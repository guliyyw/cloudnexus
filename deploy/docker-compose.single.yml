services:
  # PostgreSQL: primary relational database for users, files, permissions,
  # projects, service registry, dashboard history, and business metadata.
  postgres:
    image: postgres:15-alpine
    command: postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=2GB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=20
      -c wal_buffers=16MB
      -c synchronous_commit=on
    environment:
      POSTGRES_USER: cloudnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cloudnexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnexus"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis: cache, token/session support, websocket fan-out, and async
  # coordination used by IM/collaboration/drama-related services.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO: object storage for cloud drive files, previews, albums, documents,
  # generated media, uploaded references, audio, and backups.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  # User/File service: authentication, cloud drive, RBAC/admin backend,
  # dashboard/status APIs, music/album/trash/share, and service control.
  user-file-svc:
    build:
      context: ../server
      args:
        SERVICE: user-file-svc
        INSTALL_LIBREOFFICE: "true"
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 1
      SERVER_PORT: 8081
      NODE_NAME: user-file-svc
      NODE_HOST: user-file-svc
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@cloudnexus.local}
      # 数据库/Redis/MinIO/JWT 配置
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    group_add:
      - "0"
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # IM service: realtime chat, conversations, friend messaging, websocket
  # delivery, unread status, and cross-node message relay.
  im-svc:
    profiles: ["im"]
    build:
      context: ../server
      args:
        SERVICE: im-svc
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 2
      SERVER_PORT: 8082
      NODE_NAME: im-svc
      NODE_HOST: im-svc
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Docker service: container/image management UI backend, Docker endpoint
  # management, container logs/stats/actions, and remote Docker endpoints.
  docker-svc:
    profiles: ["docker"]
    build:
      context: ../server
      args:
        SERVICE: docker-svc
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 3
      SERVER_PORT: 8083
      NODE_NAME: docker-svc
      NODE_HOST: docker-svc
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # MediaMTX: RTSP to HLS media gateway used by the camera module for browser
  # camera stream playback.
  mediamtx:
    profiles: ["camera"]
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # AI inference: camera/video analysis backend, currently used for object
  # detection and related camera AI features.
  ai-inference:
    profiles: ["camera"]
    build:
      context: .
      dockerfile: ./ai-inference/Dockerfile
    environment:
      AI_INFERENCE_TOKEN: ${AI_INFERENCE_TOKEN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # Camera service: camera CRUD, stream lifecycle, face library/attendance,
  # video/image detection, and integration with MediaMTX plus AI inference.
  camera-recordings-init:
    profiles: ["camera"]
    image: alpine:3.21
    user: "0:0"
    command: ["sh", "-c", "chown ${HOST_UID:-1000}:${HOST_GID:-1000} /recordings"]
    volumes:
      - camera_recordings:/recordings
    restart: "no"

  camera-svc:
    profiles: ["camera"]
    build:
      context: ../server
      args:
        SERVICE: camera-svc
        INSTALL_FFMPEG: "true"
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 5
      SERVER_PORT: 8085
      NODE_NAME: camera-svc
      NODE_HOST: camera-svc
      MEDIAMTX_API_URL: http://mediamtx:8889
      MEDIAMTX_API_USER: ${MEDIAMTX_API_USER:-cloudnexus}
      MEDIAMTX_API_PASSWORD: ${MEDIAMTX_API_PASSWORD:-cloudnexus123}
      AI_INFERENCE_URL: http://ai-inference:8000
      AI_INFERENCE_TOKEN: ${AI_INFERENCE_TOKEN}
      CAMERA_RECORDING_DIR: /app/recordings
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
      - camera_recordings:/app/recordings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mediamtx:
        condition: service_started
      ai-inference:
        condition: service_started
      camera-recordings-init:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Collaboration service: realtime collaborative document websocket backend
  # based on Yjs/CRDT synchronization.
  collab-svc:
    profiles: ["collab"]
    build:
      context: ../server
      args:
        SERVICE: collab-svc
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 6
      SERVER_PORT: 8086
      NODE_NAME: collab-svc
      NODE_HOST: collab-svc
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Drama service: short drama workshop backend, project/storyboard/assets,
  # TTS/audio, image tasks, ComfyUI integration, and video generation pipeline.
  drama-svc:
    profiles: ["drama"]
    build:
      context: ../server
      args:
        SERVICE: drama-svc
        INSTALL_FFMPEG: "true"
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 7
      SERVER_PORT: 8087
      NODE_NAME: drama-svc
      NODE_HOST: drama-svc
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8087/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ComfyUI: GPU image generation engine for Stable Diffusion/IP-Adapter style
  # workflows used by drama/image generation features.
  comfyui:
    profiles: ["comfyui"]
    build:
      context: ./comfyui
      args:
        COMFYUI_REF: ${COMFYUI_REF:-v0.30.0}
        PYTORCH_CUDA_INDEX: ${PYTORCH_CUDA_INDEX:-https://mirrors.aliyun.com/pytorch-wheels/cu130}
        PYTORCH_VERSION: ${PYTORCH_VERSION:-2.11.0}
        TORCHVISION_VERSION: ${TORCHVISION_VERSION:-0.26.0}
        TORCHAUDIO_VERSION: ${TORCHAUDIO_VERSION:-2.11.0}
    command: ["--listen", "0.0.0.0", "--port", "8188"]
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      COMFYUI_DOWNLOAD_H3_MODELS: ${COMFYUI_DOWNLOAD_H3_MODELS:-false}
    gpus: all
    shm_size: "8gb"
    volumes:
      - comfyui_models:/app/ComfyUI/models
      - comfyui_custom_nodes:/app/ComfyUI/custom_nodes
      - comfyui_input:/app/ComfyUI/input
      - comfyui_output:/app/ComfyUI/output
      - comfyui_user:/app/ComfyUI/user
      - comfyui_insightface:/root/.insightface
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 90s

  # Nginx: single public gateway, static frontend server, runtime service
  # discovery proxy, websocket proxy, and HLS/API routing entrypoint.
  nginx:
    image: nginx:alpine
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/discovery:/etc/nginx/discovery:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../client/dist:/usr/share/nginx/html:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

volumes:
  pgdata:
  redisdata:
  miniodata:
  comfyui_models:
  comfyui_custom_nodes:
  comfyui_input:
  comfyui_output:
  comfyui_user:
  comfyui_insightface:
  camera_recordings:
