services:
  postgres:
    image: postgres:15-alpine
    command: postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c effective_cache_size=2GB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_connections=20
      -c wal_buffers=16MB
      -c synchronous_commit=on
    environment:
      POSTGRES_USER: cloudnexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cloudnexus
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudnexus"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-file-svc:
    build:
      context: ../server
      args:
        SERVICE: user-file-svc
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 1
      SERVER_PORT: 8081
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@cloudnexus.local}
      # 数据库/Redis/MinIO/JWT 配置
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  im-svc:
    build:
      context: ../server
      args:
        SERVICE: im-svc
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 2
      SERVER_PORT: 8082
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  docker-svc:
    build:
      context: ../server
      args:
        SERVICE: docker-svc
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 3
      SERVER_PORT: 8083
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  ai-inference:
    build:
      context: .
      dockerfile: ./ai-inference/Dockerfile
    environment:
      AI_INFERENCE_TOKEN: ${AI_INFERENCE_TOKEN}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  camera-svc:
    build:
      context: ../server
      args:
        SERVICE: camera-svc
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 5
      SERVER_PORT: 8085
      MEDIAMTX_API_URL: http://mediamtx:8889
      AI_INFERENCE_URL: http://ai-inference:8000
      AI_INFERENCE_TOKEN: ${AI_INFERENCE_TOKEN}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  collab-svc:
    build:
      context: ../server
      args:
        SERVICE: collab-svc
    environment:
      CONFIG_PATH: /app/config/config.docker.yaml
      SERVICE_VERSION: latest
      SNOWFLAKE_NODE_ID: 6
      SERVER_PORT: 8086
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:3000}
    volumes:
      - ../server/config/config.docker.yaml:/app/config/config.docker.yaml:ro
      - ../server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../client/dist:/usr/share/nginx/html:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    depends_on:
      user-file-svc:
        condition: service_healthy
      im-svc:
        condition: service_healthy
      docker-svc:
        condition: service_healthy
      collab-svc:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
