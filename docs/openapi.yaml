            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ClusterNodeListResponse'
    post:
      tags: [管理后台]
      summary: 手动添加节点
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNodeRequest'
      responses:
        '200':
          description: 添加成功

  /api/v1/admin/nodes/{name}:
    get:
      tags: [管理后台]
      summary: 获取单个节点详情
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 节点详情
    delete:
      tags: [管理后台]
      summary: 删除节点
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功

  /api/v1/admin/nodes/{name}/sessions:
    get:
      tags: [管理后台]
      summary: 节点在线会话历史
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 会话历史列表

  # ── Admin Metrics ──
  /api/v1/admin/metrics/resources:
    get:
      tags: [管理后台]
      summary: 系统资源指标
      responses:
        '200':
          description: 资源使用情况
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ResourceMetrics'

  /api/v1/admin/metrics/history:
    get:
      tags: [管理后台]
      summary: 指标历史
      description: 最近 300 个快照（每 10s 采集一次）
      responses:
        '200':
          description: 历史指标列表

  # ════════════════════════════════════════════════════
  # System / Health
  # ════════════════════════════════════════════════════

  /healthz:
    get:
      tags: [系统]
      summary: 聚合健康检查（Nginx → user-file-svc）
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/metrics:
    get:
      tags: [系统]
      summary: 运行时指标
      security: []
      responses:
        '200':
          description: Go runtime 指标

  /api/v1/metrics/resources:
    get:
      tags: [系统]
      summary: 系统资源指标
      security: []
      responses:
        '200':
          description: 系统资源使用

  # ── WebSocket ──
  /ws:
    get:
      tags: [即时通讯]
      summary: WebSocket 连接
      description: |
        建立 WebSocket 长连接用于实时消息。认证通过 `?token=<jwt>` 查询参数。
        消息格式为 JSON：`{"type":"message","content":...,"conversation_id":...}`
        消息类型：`message`、`ping`/`pong`、`read_receipt`、`presence`、`ack`、`error`
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: JWT access token
      responses:
        '101':
          description: WebSocket 升级成功
