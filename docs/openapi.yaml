openapi: "3.0.3"
info:
  title: CloudNexus API
  description: |
    CloudNexus 自托管协作平台 API — 四个 Go 微服务：
    - **user-file-svc** (8081)：用户认证、文件管理、分享、管理后台
    - **im-svc** (8082)：即时通讯、WebSocket、好友系统
    - **docker-svc** (8083)：Docker 容器与镜像管理
    - **camera-svc** (8085)：摄像头管理、流代理、AI 识别

    所有认证接口使用 Bearer Token（JWT），通过 `Authorization: Bearer <token>` 请求头传递。
    WebSocket 通过 `?token=<jwt>` 查询参数认证。公开分享接口无需认证。
  version: 0.1.0-dev
  contact:
    name: CloudNexus Team

servers:
  - url: http://localhost
    description: 本地单机部署 (nginx 80 端口统一入口)

tags:
  - name: 用户认证
    description: 注册、登录、令牌刷新
  - name: 用户信息
    description: 个人资料查询与修改
  - name: 文件管理
    description: 文件上传、下载、目录、搜索、批量操作
  - name: 文件分享
    description: 创建分享链接、密码保护、公开访问
  - name: 即时通讯
    description: 会话、消息、WebSocket
  - name: 好友系统
    description: 好友请求、列表、删除
  - name: 聊天备份
    description: 会话导出与导入
  - name: Docker 管理
    description: 容器生命周期、镜像管理、端点
  - name: 管理后台
    description: 用户管理、日志查看、集群节点、系统指标
  - name: 摄像头管理
    description: 摄像头列表、流代理、播放控制
  - name: AI 识别
    description: 视频流实时检测、图片分析、识别事件
  - name: 系统
    description: 健康检查、运行时指标

# ────────────────────────────────────────────────────
# Security
# ────────────────────────────────────────────────────
security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ── Shared Schemas ──
  schemas:
    # Generic response envelope
    APIResponse:
      type: object
      properties:
        code:
          type: integer
          description: HTTP 状态码
        message:
          type: string
          description: 状态描述
        data:
          type: object
          description: 响应数据

    Pagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    # ── User ──
    UserProfile:
      type: object
      properties:
        id:
          type: string
          description: Snowflake ID
        username:
          type: string
        email:
          type: string
        avatar:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 6
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (8h TTL)
        refresh_token:
          type: string
          description: JWT refresh token (7d TTL)
        expires_in:
          type: integer
          description: Access token 过期秒数

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    UpdateProfileRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        avatar:
          type: string

    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
        new_password:
          type: string
          minLength: 6

    # ── File ──
    FileInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int64
        mime_type:
          type: string
        is_dir:
          type: boolean
        parent_id:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FileListResponse:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileInfo'
        pagination:
          $ref: '#/components/schemas/Pagination'

    MkdirRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        parent_id:
          type: string

    BatchDeleteRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string

    BatchDownloadRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string

    MoveCopyRequest:
      type: object
      required: [target_parent_id]
      properties:
        target_parent_id:
          type: string

    # ── Share ──
    ShareInfo:
      type: object
      properties:
        id:
          type: string
        file_id:
          type: string
        code:
          type: string
          description: 12位随机 hex 分享码
        has_password:
          type: boolean
        expire_at:
          type: string
          format: date-time
          nullable: true
        file_name:
          type: string
        file_size:
          type: integer
          format: int64
        mime_type:
          type: string

    CreateShareRequest:
      type: object
      properties:
        password:
          type: string
          description: 可选访问密码
        expire_days:
          type: integer
          description: 有效期天数，0 表示永久

    VerifyShareRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string

    # ── IM ──
    Conversation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [private, group]
        name:
          type: string
        avatar:
          type: string
        unread_count:
          type: integer
        last_message:
          type: string
        last_msg_type:
          type: string
        last_msg_at:
          type: string
          format: date-time

    CreateConversationRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [private, group]
        name:
          type: string
          description: 群聊名称（群聊必填）
        user_ids:
          type: array
          items:
            type: string
          description: 成员 ID 列表（私聊为对方 ID，群聊为成员列表）

    Message:
      type: object
      properties:
        id:
          type: string
        conversation_id:
          type: string
        sender_id:
          type: string
        sender_name:
          type: string
        msg_type:
          type: string
          enum: [text, image, video, file, system]
        content:
          type: string
          description: 文本内容或 JSON 序列化的富媒体元数据
        seq:
          type: integer
        created_at:
          type: string
          format: date-time

    MessageListResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    SendMessageRequest:
      type: object
      properties:
        msg_type:
          type: string
          enum: [text, image, video, file, system]
          default: text
        content:
          type: string

    AddGroupMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string

    LinkPreviewResponse:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        image:
          type: string
        site_name:
          type: string

    # ── Friend ──
    FriendInfo:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        friend_id:
          type: string
        friend_username:
          type: string
        status:
          type: string
          enum: [pending, accepted]
        created_at:
          type: string
          format: date-time

    FriendRequest:
      type: object
      required: [username]
      properties:
        username:
          type: string
          description: 对方用户名

    # ── Import/Export ──
    ImportSummary:
      type: object
      properties:
        inserted:
          type: integer
          description: 成功导入消息数
        skipped:
          type: integer
          description: 跳过（重复）消息数
        total:
          type: integer
          description: 文件中总消息数

    # ── Docker ──
    DockerContainer:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        image:
          type: string
        status:
          type: string
        state:
          type: string
        created:
          type: string
          format: date-time
        ports:
          type: array
          items:
            type: object

    CreateContainerRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
        name:
          type: string
        ports:
          type: object
          additionalProperties:
            type: string
        env:
          type: array
          items:
            type: string
        volumes:
          type: array
          items:
            type: string
        labels:
          type: object
          additionalProperties:
            type: string

    ContainerStats:
      type: object
      properties:
        cpu_percent:
          type: number
        memory_usage:
          type: integer
          format: int64
        memory_limit:
          type: integer
          format: int64
        memory_percent:
          type: number
        network_rx:
          type: integer
          format: int64
        network_tx:
          type: integer
          format: int64

    DockerImage:
      type: object
      properties:
        id:
          type: string
        repository:
          type: string
        tag:
          type: string
        size:
          type: integer
          format: int64
        created:
          type: string
          format: date-time

    PullImageRequest:
      type: object
      required: [image]
      properties:
        image:
          type: string
          description: 镜像名，如 nginx:alpine

    DockerEndpoint:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        status:
          type: string
        node_type:
          type: string

    # ── Camera ──
    Camera:
      type: object
      properties:
        id:
          type: string
          description: Snowflake ID
        owner_id:
          type: string
        name:
          type: string
        stream_url:
          type: string
        protocol:
          type: string
          enum: [rtsp, rtmp, onvif]
        status:
          type: string
          enum: [online, offline]
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateCameraRequest:
      type: object
      required: [name, stream_url]
      properties:
        name:
          type: string
        stream_url:
          type: string
        protocol:
          type: string
          default: rtsp

    UpdateCameraRequest:
      type: object
      properties:
        name:
          type: string
        stream_url:
          type: string
        protocol:
          type: string

    RecognitionEvent:
      type: object
      properties:
        id:
          type: string
        camera_id:
          type: string
        event_type:
          type: string
        confidence:
          type: number
        snapshot_url:
          type: string
        metadata:
          type: string
        created_at:
          type: string
          format: date-time

    DetectedObject:
      type: object
      properties:
        class:
          type: string
        confidence:
          type: number
        x1:
          type: number
        y1:
          type: number
        x2:
          type: number
        y2:
          type: number

    CameraListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Camera'
        total:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    StreamURLResponse:
      type: object
      properties:
        hls_url:
          type: string
        webrtc_url:
          type: string
          nullable: true

    # ── Admin ──
    AdminUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        is_admin:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time

    AdminUserListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ClusterNode:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        status:
          type: string
          enum: [healthy, unresponsive, offline]
        node_type:
          type: string
          enum: [service, infrastructure, docker_endpoint]
        service:
          type: string
        container_name:
          type: string
        version:
          type: string
        first_seen_at:
          type: string
          format: date-time
        last_heartbeat:
          type: string
          format: date-time
        total_online_seconds:
          type: integer
        offline_since:
          type: string
          format: date-time
          nullable: true

    ClusterNodeListResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ClusterNode'

    NodeSession:
      type: object
      properties:
        id:
          type: string
        node_name:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
        container_name:
          type: string
        version:
          type: string

    AddNodeRequest:
      type: object
      required: [name, host, port]
      properties:
        name:
          type: string
        host:
          type: string
        port:
          type: integer
        node_type:
          type: string
          enum: [service, infrastructure, docker_endpoint]
          default: service
        service:
          type: string
        tls_cert:
          type: string
        tls_key:
          type: string
        ca_cert:
          type: string

    LogQueryRequest:
      type: object
      properties:
        level:
          type: string
          enum: [debug, info, warn, error]
        request_id:
          type: string
        user_id:
          type: string
        service:
          type: string
        limit:
          type: integer
          default: 100

    LogEntry:
      type: object
      properties:
        level:
          type: string
        ts:
          type: string
          format: date-time
        caller:
          type: string
        msg:
          type: string
        request_id:
          type: string
        user_id:
          type: string

    # ── Health ──
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        service:
          type: string
        uptime:
          type: string
        go_version:
          type: string
        goroutines:
          type: integer
        memory_mb:
          type: number
        components:
          type: object
          additionalProperties:
            type: string

    ResourceMetrics:
      type: object
      properties:
        cpu_percent:
          type: number
        memory_total:
          type: integer
          format: int64
        memory_used:
          type: integer
          format: int64
        memory_percent:
          type: number
        disk_total:
          type: integer
          format: int64
        disk_used:
          type: integer
          format: int64
        disk_percent:
          type: number

# ════════════════════════════════════════════════════
# Paths — user-file-svc (port 8081)
# ════════════════════════════════════════════════════
paths:
  # ── Auth ──
  /api/v1/user/register:
    post:
      tags: [用户认证]
      summary: 注册新用户
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'

  /api/v1/user/login:
    post:
      tags: [用户认证]
      summary: 用户登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，返回令牌对
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'

  /api/v1/user/refresh:
    post:
      tags: [用户认证]
      summary: 刷新令牌
      description: 使用 refresh_token 换取新的令牌对
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/TokenPair'

  # ── User Profile ──
  /api/v1/user/profile:
    get:
      tags: [用户信息]
      summary: 获取当前用户信息
      responses:
        '200':
          description: 用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
    put:
      tags: [用户信息]
      summary: 修改用户信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 修改成功

  /api/v1/user/password:
    put:
      tags: [用户信息]
      summary: 修改密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 密码修改成功

  # ── File Management ──
  /api/v1/file/upload:
    post:
      tags: [文件管理]
      summary: 上传文件
      description: 支持批量上传（多个 file 字段）
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: array
                  items:
                    type: string
                    format: binary
                parent_id:
                  type: string
      responses:
        '200':
          description: 上传成功

  /api/v1/file/list:
    get:
      tags: [文件管理]
      summary: 文件列表
      parameters:
        - name: parent_id
          in: query
          schema:
            type: string
          description: 父目录 ID，空为根目录
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: 文件列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/FileListResponse'

  /api/v1/file/download/{id}:
    get:
      tags: [文件管理]
      summary: 下载文件
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: inline
          in: query
          schema:
            type: boolean
          description: true 时浏览器内联预览
      responses:
        '200':
          description: 文件二进制内容
          content:
            application/octet-stream: {}

  /api/v1/file/{id}:
    delete:
      tags: [文件管理]
      summary: 删除文件或目录
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 删除成功

  /api/v1/file/mkdir:
    post:
      tags: [文件管理]
      summary: 创建目录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MkdirRequest'
      responses:
        '200':
          description: 创建成功

  /api/v1/file/search:
    get:
      tags: [文件管理]
      summary: 搜索文件
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 搜索结果

  /api/v1/file/batch-delete:
    post:
      tags: [文件管理]
      summary: 批量删除
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDeleteRequest'
      responses:
        '200':
          description: 批量删除成功

  /api/v1/file/batch-download:
    post:
      tags: [文件管理]
      summary: 批量下载（ZIP 打包）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchDownloadRequest'
      responses:
        '200':
          description: ZIP 文件
          content:
            application/zip: {}

  /api/v1/file/move:
    post:
      tags: [文件管理]
      summary: 移动文件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MoveCopyRequest'
                - properties:
                    file_id:
                      type: string
      responses:
        '200':
          description: 移动成功

  /api/v1/file/copy:
    post:
      tags: [文件管理]
      summary: 复制文件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MoveCopyRequest'
                - properties:
                    file_id:
                      type: string
      responses:
        '200':
          description: 复制成功

  # ── File Versions ──
  /api/v1/file/{id}/versions:
    get:
      tags: [文件管理]
      summary: 文件版本列表
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
