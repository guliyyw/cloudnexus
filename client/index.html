<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <script>(function(){try{var t=localStorage.getItem('cloudnexus-theme');document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark')}catch(e){}})();</script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SECURITY: Content Security Policy 限制资源加载来源 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss:; font-src 'self';">
    <!-- SECURITY: 禁止浏览器 MIME 嗅探 -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <!-- SECURITY: 控制 Referrer 策略 -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>CloudNexus</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="bg-blob"></div>
    <div id="bg-vignette"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
