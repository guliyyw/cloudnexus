server:
  port: 8081
  host: "0.0.0.0"

database:
  # 请通过环境变量 CLOUDNEXUS_DB_DSN 设置真实密码
  dsn: "host=localhost user=cloudnexus password=${DB_PASSWORD} dbname=cloudnexus port=5432 sslmode=require"

redis:
  addr: "localhost:6379"
  # 请通过环境变量 CLOUDNEXUS_REDIS_PASSWORD 设置密码
  password: "${REDIS_PASSWORD}"
  db: 0

minio:
  endpoint: "localhost:9000"
  # 请通过环境变量设置 MinIO 凭证
  access_key: "${MINIO_ACCESS_KEY}"
  secret_key: "${MINIO_SECRET_KEY}"
  use_ssl: true
  bucket: "cloudnexus"

log:
  level: "debug"
  format: "console"

jwt:
  # 请通过环境变量设置强密钥，至少 32 字节随机字符串
  access_secret: "${JWT_ACCESS_SECRET}"
  refresh_secret: "${JWT_REFRESH_SECRET}"
  access_ttl_sec: 28800
  refresh_ttl_sec: 604800

oauth:
  # 请通过环境变量设置 base64 编码的 32 字节密钥
  encryption_key: "${OAUTH_ENCRYPTION_KEY}"
